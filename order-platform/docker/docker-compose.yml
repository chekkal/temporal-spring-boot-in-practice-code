# Local Temporal stack for the reference app.
#
#   docker compose up -d      # start
#   docker compose down       # stop
#
# Endpoints:
#   - Temporal gRPC:  localhost:7233
#   - Temporal UI:    http://localhost:8233
#   - Postgres:       localhost:5432
#
# `name:` pins the Compose project so containers don't collide with other stacks
# the user may be running (e.g. work projects whose compose files also sit in a
# directory called `docker/`). Without this, Compose would treat those projects'
# containers as orphans of this stack and emit a noisy warning.

name: temporal-spring-boot-in-practice

services:

  postgres-temporal:
    image: postgres:16-alpine
    container_name: order-platform-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - postgres-temporal-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.27.0  # Temporal server (the SDK is 1.34; server 1.27 is compatible)
    container_name: order-platform-temporal
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgres-temporal
      - DEFAULT_NAMESPACE=default
    depends_on:
      postgres-temporal:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.31.2
    container_name: order-platform-temporal-ui
    ports:
      - "8233:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8233
    depends_on:
      - temporal

volumes:
  postgres-temporal-data:
