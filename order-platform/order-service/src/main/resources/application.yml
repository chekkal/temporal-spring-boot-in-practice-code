spring:
  application:
    name: order-service
  temporal:
    connection:
      target: localhost:7233
    namespace: default

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.example.order: DEBUG
    io.temporal: INFO
